app = "omniroute-server"
primary_region = "iad"
kill_signal = "SIGINT"
kill_timeout = 30

[build]
  image = "node:20-alpine"

[env]
  OMNIROUTE_BASE_URL = "https://omniroute-server.fly.dev"
  NODE_ENV = "production"
  PORT = "20128"
  # Data directory inside container
  OMNIROUTE_DATA_DIR = "/data"

[http_service]
  internal_port = 20128
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

  [[http_service.checks]]
    interval = 30000
    timeout = 10000
    grace_period = "30s"
    method = "GET"
    path = "/health"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 256

[mounts]
  source = "omniroute_data"
  destination = "/data"